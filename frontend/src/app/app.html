<a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

<div class="shell">
  <header class="mobile-bar">
    <a class="brand" routerLink="/">
      <span class="brand__mark" aria-hidden="true">CM</span>
      <span class="brand__name">CMWallet</span>
    </a>
    <button
      type="button"
      class="icon-btn"
      aria-controls="navegacao"
      [attr.aria-expanded]="menuAberto()"
      [attr.aria-label]="menuAberto() ? 'Fechar menu' : 'Abrir menu'"
      (click)="alternarMenu()"
    >
      <app-icon [nome]="menuAberto() ? 'fechar' : 'menu'" [tamanho]="20" />
    </button>
  </header>

  <aside class="sidebar" id="navegacao" [class.sidebar--aberta]="menuAberto()">
    <a class="brand sidebar__brand" routerLink="/">
      <span class="brand__mark" aria-hidden="true">CM</span>
      <span class="brand__name">CMWallet</span>
    </a>

    <nav class="nav" aria-label="Navegação principal">
      @for (grupo of navegacao; track $index) {
        <div class="nav__group">
          @if (grupo.titulo) {
            <p class="nav__title">{{ grupo.titulo }}</p>
          }
          @for (item of grupo.itens; track item.rota) {
            <a
              class="nav__link"
              [routerLink]="item.rota"
              routerLinkActive="nav__link--ativo"
              [routerLinkActiveOptions]="{ exact: item.rota === '/' }"
              ariaCurrentWhenActive="page"
            >
              <app-icon [nome]="item.icone" [tamanho]="18" />
              <span>{{ item.rotulo }}</span>
            </a>
          }
        </div>
      }
    </nav>
  </aside>

  @if (menuAberto()) {
    <div class="shell__overlay" aria-hidden="true" (click)="menuAberto.set(false)"></div>
  }

  <main class="content" id="conteudo" tabindex="-1">
    <router-outlet />
  </main>
</div>

<app-toast-outlet />
<app-confirm-dialog />
